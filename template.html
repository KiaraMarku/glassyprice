<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K-beauty Krahaso</title>
<meta name="description" content="Krahaso çmimet e produkteve K-beauty në dyqanet shqiptare.">
<style>
:root{
  --bg:#faf7f5; --card:#ffffff; --ink:#221d1f; --muted:#7a6f73; --line:#ece4e1;
  --accent:#b4536b; --accent-soft:#f6e6ea; --ok:#2f7d5b; --no:#a3a0a1; --sale:#c2410c;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#141113; --card:#1e1a1c; --ink:#f1eaec; --muted:#a59a9e; --line:#2e282b;
        --accent:#e58ba1; --accent-soft:#3a2229; --ok:#5fc596; --no:#6b6567; --sale:#fb923c;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:22px 16px 10px;max-width:980px;margin:auto}
h1{margin:0;font-size:24px;letter-spacing:-.02em}
h1 span{color:var(--accent)}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 16px;
  max-width:980px;margin:auto;border-bottom:1px solid var(--line)}
#q{width:100%;padding:12px 14px;font-size:16px;border:1px solid var(--line);border-radius:12px;
  background:var(--card);color:var(--ink);outline:none}
#q:focus{border-color:var(--accent)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;
  padding:6px 12px;font-size:13px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
select.chip{appearance:none;padding-right:12px}
.count{margin-left:auto;color:var(--muted);font-size:13px}
main{max-width:980px;margin:auto;padding:12px 16px 40px;display:grid;gap:12px;
  grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;gap:12px}
.top img{width:64px;height:64px;object-fit:cover;border-radius:10px;background:var(--line);flex:none}
.brand{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:600}
.name{font-weight:600;line-height:1.3}
.vol{color:var(--muted);font-size:13px}
.offers{display:flex;flex-direction:column;gap:4px}
.offer{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:9px;text-decoration:none;color:inherit;border:1px solid transparent}
.offer:hover{border-color:var(--line)}
.offer.best{background:var(--accent-soft)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--ok)}
.offer.out .dot{background:var(--no)}
.offer.out{color:var(--muted)}
.store{flex:1;font-size:14px}
.tag{font-size:11px;font-weight:600;color:var(--accent);margin-left:4px}
.price{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.was{color:var(--muted);text-decoration:line-through;font-size:12px;margin-right:4px;font-weight:400}
.sale{color:var(--sale)}
.more{grid-column:1/-1;justify-self:center}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0}
footer{max-width:980px;margin:auto;padding:0 16px 30px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header>
  <h1>K-beauty <span>Krahaso</span></h1>
  <div class="sub" id="sub"></div>
</header>
<div class="bar">
  <input id="q" type="search" autocomplete="off" placeholder="Kërko produkt ose markë (p.sh. cosrx snail)">
  <div class="filters">
    <button class="chip" id="fStock" aria-pressed="false">Vetëm në gjendje</button>
    <button class="chip" id="fMulti" aria-pressed="false">Në 2+ dyqane</button>
    <select class="chip" id="sort">
      <option value="stores">Rendit: më shumë dyqane</option>
      <option value="cheap">Rendit: çmimi më i ulët</option>
      <option value="save">Rendit: diferenca më e madhe</option>
    </select>
    <span class="count" id="count"></span>
  </div>
</div>
<main id="list"></main>
<footer>Çmimet merren automatikisht nga faqet e dyqaneve dhe mund të ndryshojnë. Kontrolloni çmimin në dyqan para blerjes.</footer>

<script id="data" type="application/json">__DATA__</script>
<script>
const D = JSON.parse(document.getElementById("data").textContent);
const PAGE = 60;
const fold = s => (s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const fmt = n => n==null ? "" : n.toLocaleString("sq-AL").replace(/ |,/g," ") + " L";
const vol = v => v ? v.replace(/^([\d.]+)(\D+)$/,"$1 $2").replace("pcs","copë") : "";

D.products.forEach(p => {
  p._hay = fold([p.brand, p.name, p.volume].join(" "));
  const inStock = p.offers.filter(o => o.in_stock && o.price != null);
  p._min = inStock.length ? Math.min(...inStock.map(o=>o.price)) : Infinity;
  p._save = inStock.length > 1 ? Math.max(...inStock.map(o=>o.price)) - p._min : 0;
  p._any = inStock.length > 0;
});

const when = new Date(D.updated);
document.getElementById("sub").textContent =
  `${D.products.length} produkte nga ${Object.keys(D.stores).length} dyqane · Përditësuar ${when.toLocaleString("sq-AL",{dateStyle:"medium",timeStyle:"short"})}`;

const st = {q:"", stock:false, multi:false, sort:"stores", shown:PAGE};
const $ = id => document.getElementById(id);

function filtered(){
  const terms = fold(st.q).split(/\s+/).filter(Boolean);
  let r = D.products.filter(p =>
    terms.every(t => p._hay.includes(t)) &&
    (!st.stock || p._any) &&
    (!st.multi || p.offers.length > 1));
  if (st.sort === "cheap") r = [...r].sort((a,b)=>a._min-b._min);
  if (st.sort === "save") r = [...r].sort((a,b)=>b._save-a._save);
  return r;
}

function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function card(p){
  const offers = p.offers.map(o => {
    const best = o.in_stock && o.price === p._min && p.offers.length > 1;
    const was = o.compare_at ? `<span class="was">${fmt(o.compare_at)}</span>` : "";
    return `<a class="offer ${o.in_stock?"":"out"} ${best?"best":""}" href="${esc(o.url)}" target="_blank" rel="noopener">
      <span class="dot"></span>
      <span class="store">${esc(D.stores[o.store]||o.store)}${best?'<span class="tag">më i liri</span>':""}${o.in_stock?"":' · mbaroi'}</span>
      <span class="price ${o.compare_at?"sale":""}">${was}${fmt(o.price)}</span></a>`;
  }).join("");
  const img = p.image ? `<img loading="lazy" src="${esc(p.image)}" alt="">` : `<img alt="">`;
  return `<article class="card"><div class="top">${img}<div>
    <div class="brand">${esc(p.brand)}</div><div class="name">${esc(p.name)}</div>
    <div class="vol">${esc(vol(p.volume))}</div></div></div>
    <div class="offers">${offers}</div></article>`;
}

function render(){
  const r = filtered();
  $("count").textContent = `${r.length} rezultate`;
  const list = $("list");
  if (!r.length){ list.innerHTML = `<div class="empty">Asnjë produkt nuk u gjet.</div>`; return; }
  list.innerHTML = r.slice(0, st.shown).map(card).join("") +
    (r.length > st.shown ? `<button class="chip more" id="more">Shfaq më shumë</button>` : "");
  const m = $("more"); if (m) m.onclick = () => { st.shown += PAGE; render(); };
}

let t;
$("q").addEventListener("input", e => { clearTimeout(t); t = setTimeout(()=>{ st.q=e.target.value; st.shown=PAGE; render(); }, 120); });
$("fStock").onclick = e => { st.stock=!st.stock; e.target.setAttribute("aria-pressed",st.stock); st.shown=PAGE; render(); };
$("fMulti").onclick = e => { st.multi=!st.multi; e.target.setAttribute("aria-pressed",st.multi); st.shown=PAGE; render(); };
$("sort").onchange = e => { st.sort=e.target.value; st.shown=PAGE; render(); };
render();
</script>
</body>
</html>
