# Refreshes prices every morning and publishes site/ to GitHub Pages.
# Setup: repo Settings > Pages > Source: "GitHub Actions".
name: update-prices

on:
  push:
    branches: [master]      # deploy on every push to master
  schedule:
    - cron: "17 5 * * *"   # 05:17 UTC daily (07:17 Tirana summer time)
    - cron: "17 17 * * *"  # 17:17 UTC daily (19:17 Tirana) — twice daily per the plan
  workflow_dispatch:        # "Run workflow" button for manual refresh

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python kbeauty.py
      - name: Commit refreshed data
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update prices $(date -u +%F)"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
