# Refreshes prices every 3 hours and publishes site/ to GitHub Pages.
# Setup: repo Settings > Pages > Source: "GitHub Actions".
name: update-prices

on:
  push:
    branches: [master]      # deploy on every push to master
  schedule:
    # Every 3 hours. GitHub delays scheduled runs by hours under load (seen: 7-10h)
    # and sometimes skips them, so frequent runs keep prices fresh anyway.
    - cron: "41 */3 * * *"
  workflow_dispatch:        # "Run workflow" button for manual refresh

# delayed runs can arrive together: run them one at a time, never two deploys at once
concurrency:
  group: update-prices
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python kbeauty.py
      - name: Commit refreshed data
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update prices $(date -u +%F)"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
